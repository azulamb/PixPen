<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>PixPen</title>
    <meta name="description" content="PixPen is a simple drawing application.">
    <link rel="shortcut icon" href="./favicon.ico">
    <style>
      html {
        height: 100%;
        font-size: 3vmin;
      }
      body {
        height: 100%;
        margin: 0;
        display: grid;
        grid-template-rows: 4rem auto 2rem;
      }
      header {
        box-sizing: border-box;
        margin: 1rem 0 0;
        background: url(./icon.svg) center center no-repeat;
      }
      h1, h2 {
        margin: 0;
        padding: 0;
      }
      h1 {
        font-size: 1rem;
        line-height: 2rem;
        text-align: center;
      }
      article {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0.4rem;
      }
      article > * {
        max-width: 22rem;
      }
      ul, dl {
        padding: 0;
        margin: 0;
      }
      ul {
        display: flex;
        gap: 0.8rem;
        list-style: none;
      }
      footer {
        text-align: center;
      }
      dialog {
        border: none;
        padding: 0;
        background: transparent;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      img {
        display: block;
      }
      img.preview {
        cursor: zoom-in;
      }
      p {
        margin: 0;
        padding: 0;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const preview = document.getElementById("preview");
        preview.addEventListener("click", () => {
          preview.close();
        });
        const imgs = document.querySelectorAll(".preview");
        imgs.forEach((img) => {
          img.addEventListener("click", () => {
            if (preview.open) {
              preview.close();
            } else {
              const clone = img.cloneNode();
              clone.style.width = "100%";
              clone.style.height = "100%";
              clone.classList.remove("preview");
              preview.innerHTML = "";
              preview.appendChild(clone);
              preview.showModal();
            }
          });
        });
      });
    </script>
  </head>
  <body>
    <header></header>
    <article>
      <h1>PixPen</h1>
      <ul>
        <li><a href="https://github.com/azulamb/PixPen">GitHub</a></li>
        <li>
          <a href="https://github.com/azulamb/PixPen/releases">Download</a>
        </li>
      </ul>
      <p>PixPenはシンプルなお絵かきツールです。</p>
      <p>
        アンチエイリアスなしのイラストを描けます。完全に個人のイラスト練習用なので機能は多くない代わりに軽量に動きます。
      </p>
      <img src="./ss.png" alt="A screenshot of PixPen" class="preview">
      <h2>動作環境</h2>
      <dl>
        <dt>OS</dt>
        <dd>Windows 11 以降</dd>
        <dt>CPU</dt>
        <dd>64bit</dd>
        <dt>Runtime</dt>
        <dd>.NET 10 以降</dd>
      </dl>
    </article>
    <footer>
      <small>&copy; 2026 Hiroki. All rights reserved.</small>
    </footer>
    <dialog id="preview"></dialog>
  </body>
</html>
